<!doctype html>
<html lang="de">

<meta name="theme-color" content="#fff8f2">
<title>Lottes Malzauber</title>
<style>
:root{color-scheme:light;--ink:#302b35;--pink:#ffe5ef;--cream:#fff8f2;--line:#f0dce4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--cream);touch-action:pan-x pan-y;color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;min-height:36px;padding:5px 8px;touch-action:manipulation;user-select:none}button.active{background:var(--pink);border-color:#dc8faf}
.app{height:100%;height:100dvh;width:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 9px env(safe-area-inset-bottom);gap:5px;max-width:760px;margin:auto;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;flex-shrink:0}h1{font-size:clamp(18px,4.7vw,24px);line-height:1.1;margin:0;font-weight:850}.small{font-size:11px;color:#7e6d79}
#categories{display:flex;gap:6px;flex-shrink:0}#categories button{flex:1;font-size:13px;font-weight:750;padding:7px 2px}
#gallery{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px;overflow:hidden;padding:2px}
.art-card{min-height:0;min-width:0;padding:4px;border-radius:13px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.art-card svg{display:block;width:100%;height:calc(100% - 18px);min-height:0;object-fit:contain}.art-card span{font-size:clamp(10px,2.7vw,12px);font-weight:750;height:18px;line-height:18px}
#studio{display:none;flex:1;min-height:0;flex-direction:column;gap:5px}.stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff;padding:4px}
#paper{display:block;width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:720/900;touch-action:none;background:white;border-radius:4px;user-select:none;-webkit-user-select:none}
.tools{display:flex;align-items:stretch;justify-content:space-between;gap:4px;flex-shrink:0}.tools button{flex:1;min-width:0;padding:5px 1px;font-size:clamp(10px,2.7vw,13px);white-space:nowrap}
#patterns{display:none;gap:4px;flex-shrink:0}#patterns button{flex:1;min-width:0;padding:4px 1px;font-size:10px}
#colors{display:flex;justify-content:space-between;gap:4px;flex-shrink:0;padding:2px 0}.swatch{width:clamp(24px,6.8vw,33px);height:clamp(24px,6.8vw,33px);min-width:0;min-height:0;padding:0;border-radius:50%;border:2px solid white;outline:1px solid #e5d5dd;box-shadow:none}.swatch.active{outline:3px solid #55404e}
#sizeRow{display:flex;align-items:center;gap:6px;min-height:30px;flex-shrink:0;font-size:11px;color:#776874}input[type=range]{flex:1;min-width:30px;max-width:100px;accent-color:#d778a0}#save{font-size:10px;padding:4px 7px;white-space:nowrap}
footer{font-size:9px;text-align:center;color:#9a8792;flex-shrink:0;padding-bottom:1px}
@media(max-height:700px){.app{gap:3px}header{min-height:34px}#categories button{min-height:32px}.tools button{min-height:32px}#sizeRow{min-height:27px}.swatch{width:25px;height:25px}}

</style>
</head>

<header><div><h1>Lottes Malzauber ✨</h1><div class="small" id="subtitle">Such dir ein Bild aus!</div></div><button class="home" id="back" style="display:none">← Bilder</button></header>

<section id="studio">
<div class="stage" id="stage"><canvas id="paper" width="720" height="900" aria-label="Ausmalbild"></canvas></div>
<div class="tools" aria-label="Werkzeuge">
<button data-tool="brush" class="active">🖍️ Malen</button><button data-tool="fill">🪣 Füllen</button><button data-tool="tape">🎀 Washi</button><button data-tool="eraser">⌫ Radierer</button><button id="undo">↶</button><button id="clear">Neu</button>
</div>
<div id="patterns" style="display:none;gap:4px;overflow:hidden"><button data-pattern="dots">● Punkte</button><button data-pattern="stripes">╱ Streifen</button><button data-pattern="hearts">♡ Herzen</button><button data-pattern="stars">☆ Sterne</button><button data-pattern="checks">▦ Karo</button></div><div id="colors" aria-label="Farben"></div>
<div id="sizeRow"><span>Strich</span><input id="size" type="range" min="4" max="32" value="12"><span id="sizeLabel">12</span><button id="save">Bild speichern</button></div>
</section>
<footer>Mit Liebe für kleine Künstlerinnen und Künstler 💗</footer>
</div>

}
function stamp(x,y,angle){
 pctx.save();pctx.translate(x,y);pctx.rotate(angle);pctx.fillStyle='rgba(255,255,255,.9)';pctx.strokeStyle='rgba(255,255,255,.9)';const r=Math.max(3,size*.38);
 if(pattern==='dots'){pctx.beginPath();pctx.arc(0,0,r,0,Math.PI*2);pctx.fill()}
 else if(pattern==='stripes'){pctx.lineWidth=Math.max(2,size*.22);pctx.beginPath();pctx.moveTo(-r*1.5,-r*2);pctx.lineTo(r*1.5,r*2);pctx.stroke()}
 else if(pattern==='hearts'||pattern==='stars'){pctx.font='bold '+Math.max(12,size*1.2)+'px sans-serif';pctx.textAlign='center';pctx.textBaseline='middle';pctx.fillText(pattern==='hearts'?'♥':'★',0,0)}
 else{pctx.fillRect(-r,-r,r*2,r*2);pctx.clearRect(-r*.35,-r*.35,r*.7,r*.7)}
 pctx.restore()
}
function line(a,b){
 pctx.save();pctx.lineCap='round';pctx.lineJoin='round';
 if(tool==='eraser'){pctx.globalCompositeOperation='destination-out';pctx.strokeStyle='#000';pctx.lineWidth=size*3}
 else{pctx.strokeStyle=color;pctx.lineWidth=tool==='tape'?Math.max(30,size*3.4):size*1.8;pctx.lineCap=tool==='tape'?'butt':'round'}
 pctx.beginPath();pctx.moveTo(a.x,a.y);pctx.lineTo(b.x,b.y);pctx.stroke();
 if(tool==='tape'){const dist=Math.hypot(b.x-a.x,b.y-a.y),ang=Math.atan2(b.y-a.y,b.x-a.x),step=Math.max(18,size*2.2);for(let d=step/2;d<dist;d+=step)stamp(a.x+(b.x-a.x)*d/dist,a.y+(b.y-a.y)*d/dist,ang)}
 pctx.restore()
}
canvas.addEventListener('pointerdown',e=>{if(!current)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=point(e);if(tool==='fill'){saveState();fillAt(p.x,p.y);render();persist();return}saveState();drawing=true;last=p;line(p,p);render()});
canvas.addEventListener('pointermove',e=>{if(!drawing||!last)return;e.preventDefault();const p=point(e);line(last,p);last=p;render()});
function stop(){if(drawing){drawing=false;last=null;persist()}}
canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('lostpointercapture',stop);
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('patterns').style.display=t==='tape'?'flex':'none'}
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));document.querySelectorAll('[data-pattern]').forEach(b=>b.addEventListener('click',()=>{pattern=b.dataset.pattern;document.querySelectorAll('[data-pattern]').forEach(x=>x.classList.toggle('active',x===b))}));
palette.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c===color?' active':'');b.style.background=c;b.setAttribute('aria-label',c);b.addEventListener('click',()=>{color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b))});$('colors').appendChild(b)});
$('size').addEventListener('input',e=>{size=Number(e.target.value);$('sizeLabel').textContent=size});
$('undo').addEventListener('click',()=>{const s=undoStack.pop();if(s){fctx.putImageData(s.fills,0,0);pctx.putImageData(s.paint,0,0);render();persist()}});
$('clear').addEventListener('click',()=>{if(!current)return;saveState();pctx.clearRect(0,0,W,H);fctx.clearRect(0,0,W,H);render();persist()});
$('back').addEventListener('click',()=>{studio.style.display='none';gallery.style.display='grid';$('back').style.display='none';$('subtitle').textContent='Such dir ein Bild aus!';current=null});
$('save').addEventListener('click',()=>{render();const a=document.createElement('a');a.download='lottes-malzauber-'+current.id+'.png';a.href=canvas.toDataURL('image/png');a.click()});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});let lastTouch=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<300)e.preventDefault();lastTouch=now},{passive:false});document.addEventListener('touchmove',e=>{if(!e.target.closest('#paper'))e.preventDefault()},{passive:false});drawGallery();
})();
</script>
