</div></div>
</section>
</div>

function scheduleSave(){setStatus('…');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,350)}
function restorePaint(data){return new Promise(resolve=>{pctx.clearRect(0,0,paint.width,paint.height);if(!data){render();resolve();return}const im=new Image();im.onload=()=>{const tmp=document.createElement('canvas');tmp.width=paint.width;tmp.height=paint.height;const t=tmp.getContext('2d',{willReadFrequently:true});t.drawImage(im,0,0,tmp.width,tmp.height);const img=t.getImageData(0,0,tmp.width,tmp.height),d=img.data,od=document.createElement('canvas');od.width=paint.width;od.height=paint.height;const o=od.getContext('2d',{willReadFrequently:true});o.drawImage(outlineImage,0,0);const lines=o.getImageData(0,0,od.width,od.height).data;for(let i=0,j=0;i<d.length;i+=4,j++){if(lines[i]<145&&lines[i+1]<145&&lines[i+2]<145&&lines[i+3]>100){d[i+3]=0;continue}if(d[i]>246&&d[i+1]>246&&d[i+2]>246){d[i+3]=0;continue}if(d[i+3]===0)continue}t.putImageData(img,0,0);pctx.clearRect(0,0,paint.width,paint.height);pctx.drawImage(tmp,0,0);render();resolve()};im.onerror=()=>{render();resolve()};im.src=data})}
async function openArt(id){current=id;tool='brush';document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));$('homeScreen').classList.remove('active');$('paintScreen').classList.add('active');$('homeBtn').style.display='inline-block';$('paintTitle').textContent=art[id].emoji+' '+art[id].name;undoStack=[];await drawSvg(id);fitCanvas();const data=saved(id);if(data){await restorePaint(data);setStatus('●')}else setStatus('●');window.scrollTo(0,0)}
function goHome(){if(current)saveNow();$('paintScreen').classList.remove('active');$('homeScreen').classList.add('active');$('homeBtn').style.display='none';current=null;renderGallery()}
function xy(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function brushAt(p,q){pctx.save();pctx.lineCap='round';pctx.lineJoin='round';pctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';pctx.strokeStyle=color;pctx.fillStyle=color;
if(tool==='brush'||tool==='eraser'){pctx.lineWidth=size*2.4;pctx.beginPath();if(Math.hypot(q.x-p.x,q.y-p.y)<0.5){pctx.arc(p.x,p.y,pctx.lineWidth/2,0,Math.PI*2);pctx.fill()}else{pctx.moveTo(p.x,p.y);pctx.lineTo(q.x,q.y);pctx.stroke()}}
else if(tool==='glitter'){pctx.lineWidth=size*1.15;pctx.beginPath();pctx.moveTo(p.x,p.y);pctx.lineTo(q.x,q.y);pctx.stroke();const glitters=['#ff45a5','#b75cff','#ffd638','#62dff5','#ffffff'];for(let i=0;i<7;i++){const x=q.x+(Math.random()-.5)*size*3.5,y=q.y+(Math.random()-.5)*size*3.5,r=Math.max(2,size*(.12+Math.random()*.12));pctx.fillStyle=glitters[i%glitters.length];pctx.globalAlpha=.95;pctx.beginPath();if(i%2===0){pctx.moveTo(x,y-r*2);pctx.lineTo(x+r*.45,y-r*.4);pctx.lineTo(x+r*2,y);pctx.lineTo(x+r*.45,y+r*.4);pctx.lineTo(x,y+r*2);pctx.lineTo(x-r*.45,y+r*.4);pctx.lineTo(x-r*2,y);pctx.lineTo(x-r*.45,y-r*.4);pctx.closePath()}else pctx.arc(x,y,r,0,Math.PI*2);pctx.fill()}pctx.globalAlpha=1}
else if(tool==='pattern'){
  const dx=q.x-p.x,dy=q.y-p.y,dist=Math.hypot(dx,dy),tapeW=Math.max(28,size*3.4);
  pctx.lineCap='butt';pctx.lineJoin='round';pctx.lineWidth=tapeW;pctx.strokeStyle=color;
  pctx.beginPath();
  if(dist<0.5){pctx.moveTo(p.x-tapeW/2,p.y);pctx.lineTo(p.x+tapeW/2,p.y)}
  else{pctx.moveTo(p.x,p.y);pctx.lineTo(q.x,q.y)}
  pctx.stroke();
  // Continuous wide tape with evenly spaced white dots and diagonal accents.
  const steps=Math.max(1,Math.floor(dist/Math.max(14,tapeW*.38)));
  for(let i=0;i<=steps;i++){
    const f=steps?i/steps:0,x=p.x+dx*f,y=p.y+dy*f;
    pctx.fillStyle='rgba(255,255,255,.84)';pctx.beginPath();pctx.arc(x,y,Math.max(2,tapeW*.07),0,Math.PI*2);pctx.fill();
    pctx.strokeStyle='rgba(255,255,255,.78)';pctx.lineWidth=Math.max(2,tapeW*.045);
    pctx.beginPath();pctx.moveTo(x-tapeW*.12,y-tapeW*.2);pctx.lineTo(x+tapeW*.12,y+tapeW*.2);pctx.stroke();
  }
}
pctx.restore();render()}
function boundaryFill(x,y){
  const w=paint.width,h=paint.height,ix=Math.floor(x),iy=Math.floor(y);
  if(ix<0||iy<0||ix>=w||iy>=h||!outlineMask)return;
  const start=iy*w+ix;
  if(outlineMask[start])return;
  const img=pctx.getImageData(0,0,w,h),d=img.data,fill=hexRgb(color);
  const queue=new Int32Array(w*h),seen=new Uint8Array(w*h);
  let head=0,tail=0;queue[tail++]=start;seen[start]=1;
  while(head<tail){
    const pos=queue[head++],k=pos*4;
    d[k]=fill[0];d[k+1]=fill[1];d[k+2]=fill[2];d[k+3]=255;
    const x0=pos%w,y0=(pos/w)|0;
    if(x0>0){const n=pos-1;if(!seen[n]&&!outlineMask[n]){seen[n]=1;queue[tail++]=n}}
    if(x0<w-1){const n=pos+1;if(!seen[n]&&!outlineMask[n]){seen[n]=1;queue[tail++]=n}}
    if(y0>0){const n=pos-w;if(!seen[n]&&!outlineMask[n]){seen[n]=1;queue[tail++]=n}}
    if(y0<h-1){const n=pos+w;if(!seen[n]&&!outlineMask[n]){seen[n]=1;queue[tail++]=n}}
  }
  pctx.putImageData(img,0,0);render();
}
function hexRgb(hex){const v=parseInt(hex.slice(1),16);return[(v>>16)&255,(v>>8)&255,v&255]}
canvas.addEventListener('pointerdown',e=>{if(!current||!outlineImage)return;e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}const r=canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};if(tool==='fill'){snapshot();boundaryFill(p.x,p.y);scheduleSave();return}snapshot();drawing=true;last=p;brushAt(p,p)});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const r=canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};brushAt(last,p);last=p;scheduleSave()});
function endDraw(){if(drawing){drawing=false;scheduleSave()}last=null}
canvas.addEventListener('pointerup',endDraw);canvas.addEventListener('pointercancel',endDraw);
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));$('hint').textContent=''}));
$('customColor').addEventListener('input',e=>setColor(e.target.value));$('brushSize').addEventListener('input',e=>{size=Number(e.target.value);$('sizeValue').textContent=size});
$('undoBtn').onclick=()=>{if(undoStack.length){const im=new Image();im.onload=()=>{pctx.clearRect(0,0,paint.width,paint.height);pctx.drawImage(im,0,0,paint.width,paint.height);render();scheduleSave()};im.src=undoStack.pop()}};
$('clearBtn').onclick=()=>{if(!current)return;const ok=confirm('Möchtest du dieses Bild wirklich neu anfangen?');if(ok){snapshot();drawSvg(current).then(scheduleSave)}};
$('backBtn').onclick=goHome;$('homeBtn').onclick=goHome;
window.addEventListener('resize',()=>{if($('paintScreen').classList.contains('active'))fitCanvas()});
window.addEventListener('orientationchange',()=>setTimeout(fitCanvas,80));
window.addEventListener('pagehide',()=>{if(current){try{localStorage.setItem(storageKey(current),paint.toDataURL('image/png'))}catch(e){}}});
initColors();renderGallery();
</script>
</body>
